<?xml version="1.0" standalone="no"?>

<svg width="600" height="600" version="1.1" xmlns="http://www.w3.org/2000/svg">

 <!-- 左竖线 左上 右上 右下(400-70) 左下 -->
<path d="M 50 100 L 120 100 L 120 330 L 50 400 Z " stroke="black" stroke-width="1" fill="black"/>

 <!-- 上横线 左上 右上 右下 左下(200+70) -->
<path d="M 200 50 L 500 50 L 500 120 L 270 120 Z " stroke="black" stroke-width="1" fill="black"/>

 <!-- 右竖线 左上(200+70) 右上 右下 左下 -->
<path d="M 480 270 L 550 200 L 550 500 L 480 500 Z " stroke="black" stroke-width="1" fill="black"/>

 <!-- 下横线 左上 右上(400-70) 右下 左下 -->
<path d="M 100 480 L 330 480 L 400 550 L 100 550 Z " stroke="black" stroke-width="1" fill="black"/>

 <!-- 左上到右下斜线 -->
<path d="M 50 50 L 100 50 L 550 500 L 550 550 L 500 550 L 50 100 Z " stroke="black" stroke-width="1" fill="black"/>

 <!-- 右上到左下斜线 -->
<path d="M 550 50 L 550 100 L 100 550 L 50 550 L 50 500 L 500 50 Z " stroke="black" stroke-width="1" fill="black"/>

</svg>
